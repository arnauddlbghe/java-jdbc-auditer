# Non-web, quiet, exits after the CommandLineRunner completes.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# Datasource from environment (same contract as sample-legacy), with local defaults.
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/capture}
spring.datasource.username=${JDBC_USER:capture}
spring.datasource.password=${JDBC_PASSWORD:capture}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP: small pool so the "no double counting" behaviour is easy to reason about.
spring.datasource.hikari.pool-name=capture-hikari
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
